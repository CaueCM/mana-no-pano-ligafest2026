<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Builder — Mana no Pano</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece0c4;
    --header-bg: #f3ead6;
    --card-bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #7a6a4f;
    --body-ink: #3a3226;
    --red: #c0392b;
    --red-dark: #8f2a1e;
    --green: #2f6f4f;
    --gold: #b7791f;
    --border-soft: rgba(0,0,0,.12);
    --border-hair: rgba(0,0,0,.08);
    --shadow: 1px 2px 0 rgba(0,0,0,.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.45;
    padding-bottom: 60px;
  }
  a { color: var(--red); }
  ::selection { background: var(--red); color: #fff; }
  .display { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: .03em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* HEADER */
  header.site {
    background: var(--header-bg);
    border-bottom: 2px dashed rgba(0,0,0,.22);
  }
  .header-inner { max-width: 980px; margin: 0 auto; padding: 20px 24px 18px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
  .brand img { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); padding: 7px; display: block; }
  .wordmark { font-size: 28px; letter-spacing: .02em; line-height: 1; }
  .tagline { font: 600 10.5px 'JetBrains Mono', monospace; color: var(--muted); margin-top: 3px; letter-spacing: .03em; }
  .stamp {
    background: var(--red); color: #fff; font: 800 11px 'JetBrains Mono', monospace;
    padding: 6px 12px; border-radius: 3px; transform: rotate(3deg);
    box-shadow: 1px 2px 0 rgba(0,0,0,.2); white-space: nowrap;
  }

  main { max-width: 980px; margin: 0 auto; padding: 28px 24px 0; }
  h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 22px; color: var(--red); letter-spacing: .04em; margin: 28px 0 12px; }
  h2:first-child { margin-top: 0; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 3px;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  button {
    padding: 9px 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.2);
    background: var(--card-bg); color: var(--ink); cursor: pointer; white-space: nowrap;
    font: 800 11px 'JetBrains Mono', monospace; letter-spacing: .04em; text-transform: uppercase;
    box-shadow: var(--shadow);
  }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 1px 2px 0 rgba(0,0,0,.2); }
  button.primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
  button.danger { color: var(--red); }
  button.ghost { background: transparent; box-shadow: none; border-color: transparent; }
  button.ghost:hover { border-color: rgba(0,0,0,.2); }
  button.icon { padding: 5px 9px; font-size: 13px; }
  button:disabled { opacity: .3; cursor: default; }
  input[type=text], input[type=date], textarea, select {
    padding: 10px 12px; border-radius: 3px; border: 1px solid var(--border-soft);
    background: var(--card-bg); color: var(--ink); font: 500 13px 'Inter'; width: 100%;
    box-shadow: var(--shadow);
  }
  input::placeholder, textarea::placeholder { color: #a8987a; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--red); outline-offset: -1px; }
  input[type=date] { width: auto; }
  textarea { resize: vertical; }
  textarea.list { min-height: 260px; font: 500 12.5px/1.6 'JetBrains Mono', monospace; }
  label.field { display: block; font: 700 10.5px 'JetBrains Mono', monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .hidden { display: none !important; }
  summary { font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .03em; }

  /* Biblioteca */
  .deckitem { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .deckitem .info { flex: 1; min-width: 180px; }
  .deckitem .name { font-family: 'Bebas Neue', sans-serif; font-size: 21px; letter-spacing: .03em; line-height: 1.1; }
  .deckitem .meta { font: 600 11px 'JetBrains Mono', monospace; color: var(--muted); margin-top: 2px; }
  .empty { text-align: center; padding: 30px 16px; color: var(--muted); font-style: italic; }

  /* Lista do deck */
  .listcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .listcols h3 { margin: 0 0 6px; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 16px; letter-spacing: .03em; border-bottom: 1px solid var(--border-hair); padding-bottom: 6px; }
  .listcols ul { margin: 0; padding: 0; list-style: none; font: 500 12.5px/1.8 'Inter'; color: var(--body-ink); }
  .listcols .q { display: inline-block; width: 22px; font: 700 11px 'JetBrains Mono', monospace; color: var(--muted); }

  /* Partidas */
  .mu { padding: 0; overflow: hidden; }
  .mu-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .mu-head .title { flex: 1; min-width: 0; font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font: 800 10px 'JetBrains Mono', monospace; letter-spacing: .04em; padding: 4px 8px; border-radius: 3px; white-space: nowrap; text-transform: uppercase; }
  .badge.ok { background: var(--green); color: #fff; }
  .badge.draft { color: var(--muted); border: 1px solid rgba(0,0,0,.2); }
  .badge.warn { background: var(--gold); color: #fff; }
  .delta { font: 700 12px 'JetBrains Mono', monospace; white-space: nowrap; color: var(--muted); }
  .delta .in { color: var(--green); }
  .delta .out { color: var(--red); }
  .mu-body { border-top: 1px dashed rgba(0,0,0,.18); padding: 16px; }
  .pickcols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
  @media (max-width: 680px) { .pickcols { grid-template-columns: 1fr; } }
  .pick h4 { margin: 0 0 6px; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 16px; letter-spacing: .04em; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-hair); padding-bottom: 6px; }
  .pick.side h4 { color: var(--green); }
  .pick.main h4 { color: var(--red); }
  .pickrow {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 3px;
    font: 500 13px 'Inter'; color: var(--body-ink); user-select: none;
  }
  .pickrow .nm { flex: 1; min-width: 0; cursor: pointer; }
  .pickrow .have { width: 22px; text-align: right; font: 700 11px 'JetBrains Mono', monospace; color: var(--muted); }
  .pickrow .cnt { width: 24px; text-align: center; font: 800 13px 'JetBrains Mono', monospace; }
  .pickrow button { padding: 4px 0; width: 32px; font-size: 12px; line-height: 1; box-shadow: none; }
  .pick.side .pickrow.on { background: #eef6f3; color: var(--green); font-weight: 700; }
  .pick.main .pickrow.on { background: #fdf3f1; color: var(--red); font-weight: 700; }
  .pick.side button.go { color: var(--green); }
  .pick.main button.go { color: var(--red); }
  .orphan { color: var(--gold); font: 600 12px 'Inter'; margin-top: 10px; }
  /* Seletor de arquétipos */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip {
    font: 600 12.5px 'Inter'; text-transform: none; letter-spacing: 0; padding: 6px 10px;
    box-shadow: none; color: var(--body-ink);
  }
  button.chip .pct { font: 700 10px 'JetBrains Mono', monospace; color: var(--muted); margin-left: 5px; }
  button.chip.used { border-style: dashed; color: var(--muted); }
  button.chip.used::before { content: '✓ '; color: var(--green); font-weight: 800; }
  button.chip.sel { background: var(--ink); border-color: var(--ink); border-style: solid; color: #fff; }
  button.chip.sel .pct { color: #d8cbb0; }
  button.chip.sel::before { content: '+ '; color: #fff; }
  .coverage { font: 700 11px 'JetBrains Mono', monospace; color: var(--green); white-space: nowrap; }
  .opps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .opp {
    display: inline-flex; align-items: center; gap: 4px; background: var(--header-bg);
    border: 1px solid var(--border-soft); border-radius: 3px; padding: 3px 4px 3px 9px; font: 600 12.5px 'Inter';
  }
  .opp .pct { font: 700 10px 'JetBrains Mono', monospace; color: var(--muted); }
  .opp button { padding: 2px 6px; border: none; box-shadow: none; background: transparent; color: var(--muted); font-size: 12px; }
  .opp button:hover { color: var(--red); }
  .opps input { width: 220px; padding: 6px 10px; box-shadow: none; }
  .mu-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }

  footer.site { text-align: center; color: var(--muted); font: 500 11px 'Inter'; padding: 32px 24px 0; }
  footer.site a { color: inherit; }

  /* Pré-visualização / impressão */
  #preview {
    position: fixed; inset: 0; background: rgba(26,26,26,.7); z-index: 50;
    overflow: auto; padding: 16px;
  }
  #preview .bar {
    position: sticky; top: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    max-width: 210mm; margin: 0 auto 12px; background: var(--header-bg); padding: 10px 12px;
    border-radius: 3px; border: 1px solid var(--border-soft); z-index: 2;
  }
  #preview .bar strong { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 19px; letter-spacing: .03em; }
  #preview .bar label { font: 600 12px 'Inter'; display: flex; gap: 6px; align-items: center; }
  .sheet {
    background: #fff; color: var(--ink); width: 210mm; max-width: 100%; min-height: 297mm;
    margin: 0 auto; padding: 10mm; box-shadow: 0 4px 30px rgba(0,0,0,.4);
    font: 500 9.5pt/1.3 'Inter', sans-serif;
  }
  .sheet .shead { display: flex; align-items: center; gap: 3mm; border-bottom: 1.5px dashed rgba(0,0,0,.3); padding-bottom: 3mm; margin-bottom: 4mm; }
  .sheet .shead img { width: 9mm; height: 9mm; border-radius: 50%; background: var(--ink); padding: 1.6mm; }
  .sheet h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 22pt; letter-spacing: .03em; line-height: 1; margin: 0; }
  .sheet .sub { font: 600 7.5pt 'JetBrains Mono', monospace; color: var(--muted); letter-spacing: .03em; margin-top: 1mm; text-transform: uppercase; }
  .sheet .plist { columns: 3; column-gap: 6mm; font-size: 8.5pt; border: 1px solid #ccc; border-radius: 1mm; padding: 2.5mm 3mm; margin-bottom: 4mm; }
  .sheet .plist b { display: block; break-after: avoid; margin-top: 1mm; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 11pt; letter-spacing: .03em; color: var(--red); }
  .sheet .plist b:first-child { margin-top: 0; }
  .sheet .plist div { break-inside: avoid; }
  .sheet .mus { columns: 2; column-gap: 5mm; }
  .sheet .pmu { break-inside: avoid; border: 1px solid #bbb; border-radius: 1mm; padding: 2mm 3mm; margin-bottom: 3mm; }
  .sheet .pmu h3 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 13pt; letter-spacing: .03em; margin: 0 0 1mm; }
  .sheet .io { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
  .sheet .io .lbl { font: 800 7pt 'JetBrains Mono', monospace; letter-spacing: .04em; }
  .sheet .io .in .lbl { color: var(--green); }
  .sheet .io .out .lbl { color: var(--red); }
  .sheet .io div div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .note { margin-top: 1.2mm; padding-top: 1.2mm; border-top: 1px dashed #ccc; font-style: italic; color: var(--body-ink); font-size: 8.5pt; white-space: pre-wrap; }
  .sheet .none { color: #999; }

  @media (max-width: 600px) {
    .header-inner { padding: 16px 16px 14px; }
    main { padding: 20px 16px 0; }
    .wordmark { font-size: 24px; }
  }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    body > *:not(#preview) { display: none !important; }
    #preview { position: static; background: none; padding: 0; overflow: visible; }
    #preview .bar { display: none; }
    .sheet { box-shadow: none; width: auto; min-height: 0; margin: 0; }
    .sheet .shead img { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <div class="header-row">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Mana no Pano">
        <div>
          <div class="wordmark display">MANA NO PANO</div>
          <div class="tagline">SIDE BUILDER — MONTE SEU CADERNO DE SIDEBOARD</div>
        </div>
      </a>
      <div class="stamp">SIDE BUILDER</div>
    </div>
  </div>
</header>

<main>
  <!-- Biblioteca -->
  <section id="v-library">
    <div class="row" style="margin-bottom:12px">
      <h2 class="grow" style="margin:4px 0">Meus decks</h2>
      <button class="primary" data-act="new-deck">+ Novo deck</button>
    </div>
    <div id="deck-list"></div>
    <div class="row small" style="margin-top:20px">
      <span class="muted grow">Tudo fica salvo neste navegador. Exporte um backup pra levar pra outro aparelho.</span>
      <button data-act="export">Exportar backup</button>
      <button data-act="import">Importar backup</button>
      <input type="file" id="import-file" accept=".json,application/json" class="hidden">
    </div>
  </section>

  <!-- Novo deck / editar lista -->
  <section id="v-form" class="hidden">
    <h2 id="form-title">Novo deck</h2>
    <div class="card">
      <div class="row" style="margin-bottom:10px; align-items:flex-end">
        <div class="grow">
          <label class="field" for="f-name">Nome do deck</label>
          <input type="text" id="f-name" placeholder="ex.: Naya Ramp">
        </div>
        <div>
          <label class="field" for="f-date">Data</label>
          <input type="date" id="f-date">
        </div>
      </div>
      <label class="field" for="f-list">Lista (formato MTGO, Arena, Moxfield, LigaMagic… sideboard depois de uma linha em branco ou de "Sideboard")</label>
      <textarea id="f-list" class="list" placeholder="4 Arbor Elf
4 Avenging Hunter
...
13 Forest

Sideboard
1 Ancient Grudge
3 Breath Weapon"></textarea>
      <div id="f-preview" class="small muted" style="margin-top:8px"></div>
      <div class="row" style="margin-top:12px">
        <button class="primary" data-act="form-save">Salvar</button>
        <button data-act="form-cancel">Cancelar</button>
      </div>
    </div>
  </section>

  <!-- Deck -->
  <section id="v-deck" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <button class="ghost" data-act="go-library">← Decks</button>
      <span class="grow"></span>
      <button data-act="edit-list">Editar lista</button>
      <button data-act="dup-current">Duplicar</button>
      <button class="primary" data-act="print">Gerar versão pra imprimir</button>
    </div>
    <div class="card">
      <div class="row" style="align-items:flex-end">
        <div class="grow">
          <label class="field" for="d-name">Deck</label>
          <input type="text" id="d-name">
        </div>
        <div>
          <label class="field" for="d-date">Data</label>
          <input type="date" id="d-date">
        </div>
      </div>
      <details style="margin-top:12px">
        <summary class="small muted" id="d-summary" style="cursor:pointer; color:var(--muted)"></summary>
        <div class="listcols" id="d-list" style="margin-top:10px"></div>
      </details>
    </div>

    <h2>Partidas</h2>
    <div class="card">
      <div class="row" style="margin-bottom:8px; align-items:baseline">
        <label class="field grow" style="margin:0">Escolha um ou mais arquétipos pra montar um side · meta Pauper (MTGGoldfish, out/2026)</label>
        <span class="coverage" id="coverage"></span>
      </div>
      <div class="chips" id="meta-chips"></div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" data-act="toggle-all-meta" id="toggle-all-meta">Mostrar todos</button>
        <input type="text" id="mu-new" class="grow" placeholder="Outro arquétipo… (Enter pra incluir)" style="width:auto">
      </div>
      <div class="row" style="margin-top:12px; border-top:1px dashed rgba(0,0,0,.18); padding-top:12px">
        <span class="grow small" id="sel-summary"></span>
        <button data-act="clear-sel" id="clear-sel">Limpar</button>
        <button class="primary" data-act="add-mu" id="add-mu">Criar side</button>
      </div>
    </div>
    <datalist id="meta-dl"></datalist>
    <div id="mu-list"></div>
  </section>
</main>

<footer class="site">Mana no Pano · <a href="index.html">Caderno LigaFest 2026</a></footer>

<!-- Pré-visualização A4 -->
<div id="preview" class="hidden">
  <div class="bar">
    <strong class="grow">Pré-visualização A4</strong>
    <label><input type="checkbox" id="p-list" checked> Incluir lista</label>
    <label><input type="checkbox" id="p-drafts"> Incluir rascunhos</label>
    <button class="primary" data-act="do-print">Imprimir</button>
    <button data-act="close-preview">Fechar</button>
  </div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
const KEY = 'sidebuilder.v1';
let state = load();
let currentId = null;
let openMuId = null;
let formMode = null; // 'new' | 'edit'
let selected = [];   // arquétipos escolhidos pro próximo side
let showAllMeta = false;
const META_TOP = 20;

// Meta Pauper — MTGGoldfish (página "full", consultada em 30/10/2026)
const META = [
  ['Mono Red Madness', 13.2], ['Blue Terror', 7.7], ['Dimir Faeries', 6.2], ['Tron', 5.7], ['Elves', 5.4],
  ['Grixis Affinity', 4.7], ['Bogles', 4.3], ['Spy Combo', 4.2], ['Mono Red Rally', 3.9], ['Ruby Storm', 3.3],
  ['Grixis Control', 3.1], ['Esper Affinity', 2.9], ['Jund Wildfire', 2.5], ['Dimir Control', 2.0], ['Golgari Gardens', 2.0],
  ['Turbo Fog', 1.8], ['Familiars', 1.7], ['White Aggro', 1.7], ['Dimir Affinity', 1.7], ['Mono-Blue Faeries', 1.7],
  ['Esper Ephemerate', 1.6], ['Boros Moxite', 1.5], ['Gruul Ponza', 1.4], ['Rakdos Madness', 1.4], ['Jeskai Ephemerate', 1.3],
  ['Mono-White Aggro', 1.1], ['Black Sacrifice', 1.0], ['Snacker Gates', 0.9], ['Mardu Synthesizer', 0.8], ['Cycle Storm', 0.7],
  ['Food Gardens', 0.6], ['Glintblade', 0.6], ['Gruul Ramp', 0.6], ['Inside Out Combo', 0.5], ['Dredge', 0.5],
  ['Ephemerate Tron', 0.5], ['Boros Synthesizer', 0.5], ['4c Affinity', 0.4], ['Izzet Terror', 0.4], ['Burn', 0.4],
  ['Poison Storm', 0.3], ['Dimir Terror', 0.3], ['Infect', 0.2], ['Azorius Gates', 0.2], ['Grixis Faeries', 0.2],
  ['Walls Combo', 0.2], ['Devotion', 0.2], ['Boros Bully', 0.2], ['Azorius Faeries', 0.1], ['Mono-White Heroic', 0.1],
  ['Slivers', 0.1], ['Jeskai Affinity', 0.1], ['Mono Red Pingers', 0.1], ['4c Pestilence', 0.1], ['Selesnya Gates', 0.1],
  ['Esper Faeries', 0.1], ['Azorius Affinity', 0.1], ['Kiln Fiend', 0.1], ['Goblins', 0.1], ['Mono-Black', 0.1],
].map(([name, pct]) => ({ name, pct }));
const metaPct = name => (META.find(m => m.name.toLowerCase() === name.toLowerCase()) || {}).pct;
const label = mu => mu.opps.length ? 'vs. ' + mu.opps.join(' / ') : 'Sem adversário';

// Versões antigas guardavam um único "name" por partida
function migrate(s) {
  for (const d of s.decks) for (const mu of d.matchups) {
    if (!Array.isArray(mu.opps)) mu.opps = mu.name ? [mu.name.replace(/^vs\.?\s*/i, '')] : [];
    delete mu.name;
  }
  return s;
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.decks)) return migrate(s);
  } catch (e) {}
  return { decks: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD local
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? d.split('-').reverse().join('/') : '';
const $ = id => document.getElementById(id);
const deck = () => state.decks.find(d => d.id === currentId);
const total = arr => arr.reduce((n, c) => n + c.qty, 0);
const sumObj = o => Object.values(o).reduce((n, v) => n + v, 0);

/* ---------- Parser de lista ---------- */
function parseList(text) {
  const SIDE_MARK = /^\s*(\/\/\s*)?(sideboard|side ?board|side|sb)\s*:?\s*(\(\d+\))?\s*:?\s*$/i;
  const MAIN_MARK = /^\s*(\/\/\s*)?(deck|main ?deck|main ?board|main)\s*:?\s*(\(\d+\))?\s*:?\s*$/i;
  const COMP_MARK = /^\s*(\/\/\s*)?companion\s*:?\s*$/i;
  const CARD = /^\s*(\d+)\s*x?\s+(.+?)\s*$/i;
  const entries = [];
  let zone = null, block = 0, sawCard = false, marker = false;

  for (const raw of text.replace(/\r/g, '').split('\n')) {
    let line = raw.trim();
    if (!line) { if (sawCard) { block++; sawCard = false; } continue; }
    if (SIDE_MARK.test(line) || COMP_MARK.test(line)) { zone = 'side'; marker = true; continue; }
    if (MAIN_MARK.test(line)) { zone = 'main'; continue; }
    let lineZone = zone;
    if (/^SB:\s*/i.test(line)) { line = line.replace(/^SB:\s*/i, ''); lineZone = 'side'; marker = true; }
    const m = line.match(CARD);
    if (!m) continue;
    let name = m[2]
      .replace(/\s+\*[A-Z]+\*\s*$/i, '')               // *F* (foil)
      .replace(/\s+\([A-Za-z0-9]{2,6}\)(\s+\S+)?\s*$/, '') // (SET) 123
      .replace(/\s+\[[^\]]*\]\s*$/, '')                // [SET]
      .replace(/\s+#.*$/, '')
      .trim();
    if (!name) continue;
    entries.push({ qty: parseInt(m[1], 10), name, zone: lineZone, block });
    sawCard = true;
  }

  // Sem marcador explícito: último bloco (após linha em branco) com até 15 cartas vira side
  if (!marker) {
    const blocks = [...new Set(entries.map(e => e.block))];
    if (blocks.length > 1) {
      const last = blocks[blocks.length - 1];
      const lastTotal = entries.filter(e => e.block === last).reduce((n, e) => n + e.qty, 0);
      const restTotal = entries.filter(e => e.block !== last).reduce((n, e) => n + e.qty, 0);
      if (lastTotal <= 15 && restTotal >= 30) entries.forEach(e => { if (e.block === last) e.zone = 'side'; });
    }
  }

  const merge = list => {
    const map = new Map();
    for (const e of list) {
      const k = e.name.toLowerCase();
      if (map.has(k)) map.get(k).qty += e.qty;
      else map.set(k, { qty: e.qty, name: e.name });
    }
    return [...map.values()];
  };
  return {
    main: merge(entries.filter(e => e.zone !== 'side')),
    side: merge(entries.filter(e => e.zone === 'side')),
  };
}

function listToText(d) {
  return d.main.map(c => `${c.qty} ${c.name}`).join('\n') +
    (d.side.length ? '\n\nSideboard\n' + d.side.map(c => `${c.qty} ${c.name}`).join('\n') : '');
}

/* ---------- Navegação ---------- */
function show(view) {
  for (const v of ['library', 'form', 'deck']) $('v-' + v).classList.toggle('hidden', v !== view);
  window.scrollTo(0, 0);
}

/* ---------- Biblioteca ---------- */
function renderLibrary() {
  const decks = [...state.decks].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);
  $('deck-list').innerHTML = decks.length ? decks.map(d => {
    const done = d.matchups.filter(m => m.done).length;
    return `<div class="card deckitem">
      <div class="info">
        <div class="name">${esc(d.name || 'Sem nome')}</div>
        <div class="meta">${fmtDate(d.date)} · ${total(d.main)} + ${total(d.side)} cartas · ${d.matchups.length} partida${d.matchups.length === 1 ? '' : 's'}${d.matchups.length ? ` (${done} confirmada${done === 1 ? '' : 's'})` : ''}</div>
      </div>
      <button class="primary" data-act="open" data-id="${d.id}">Abrir</button>
      <button data-act="dup" data-id="${d.id}">Duplicar</button>
      <button class="danger ghost" data-act="del-deck" data-id="${d.id}">Excluir</button>
    </div>`;
  }).join('') : `<div class="card empty">Nenhum deck ainda. Clique em <b>+ Novo deck</b> e cole a lista.</div>`;
}

function openForm(mode) {
  formMode = mode;
  const d = mode === 'edit' ? deck() : null;
  $('form-title').textContent = d ? 'Editar lista' : 'Novo deck';
  $('f-name').value = d ? d.name : '';
  $('f-date').value = d ? d.date : today();
  $('f-list').value = d ? listToText(d) : '';
  updateFormPreview();
  show('form');
  (d ? $('f-list') : $('f-name')).focus();
}

function updateFormPreview() {
  const p = parseList($('f-list').value);
  const t = $('f-list').value.trim();
  $('f-preview').innerHTML = t
    ? `Reconhecido: <b>${total(p.main)}</b> no main (${p.main.length} cartas diferentes) · <b>${total(p.side)}</b> no side (${p.side.length} diferentes)`
    : '';
}

function saveForm() {
  const p = parseList($('f-list').value);
  if (!p.main.length) { alert('Não reconheci nenhuma carta. Use o formato "4 Nome da Carta" por linha.'); return; }
  const name = $('f-name').value.trim() || 'Deck sem nome';
  const date = $('f-date').value || today();
  if (formMode === 'edit') {
    Object.assign(deck(), { name, date, main: p.main, side: p.side });
  } else {
    const d = { id: uid(), name, date, createdAt: Date.now(), main: p.main, side: p.side, matchups: [] };
    state.decks.push(d);
    currentId = d.id;
  }
  save();
  openDeck(currentId);
}

function duplicateDeck(id) {
  const src = state.decks.find(d => d.id === id);
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.date = today();
  copy.createdAt = Date.now();
  copy.matchups.forEach(m => m.id = uid());
  state.decks.push(copy);
  save();
  openDeck(copy.id);
}

/* ---------- Deck ---------- */
function openDeck(id) {
  currentId = id;
  openMuId = null;
  selected = [];
  const d = deck();
  $('d-name').value = d.name;
  $('d-date').value = d.date;
  renderDeckList();
  renderMatchups();
  renderPicker();
  show('deck');
}

function renderDeckList() {
  const d = deck();
  $('d-summary').textContent = `Ver lista — ${total(d.main)} main · ${total(d.side)} side`;
  const col = (title, arr) => `<div><h3>${title} (${total(arr)})</h3><ul>${arr.map(c => `<li><span class="q">${c.qty}</span>${esc(c.name)}</li>`).join('')}</ul></div>`;
  $('d-list').innerHTML = col('Main deck', d.main) + col('Sideboard', d.side);
}

// Quantidade válida (limitada ao que existe na lista atual)
function eff(mu, d) {
  const lim = (obj, arr) => {
    const out = {};
    for (const c of arr) { const v = Math.min(obj[c.name] || 0, c.qty); if (v) out[c.name] = v; }
    return out;
  };
  return { ins: lim(mu.ins, d.side), outs: lim(mu.outs, d.main) };
}
function orphans(mu, d) {
  return [...Object.keys(mu.ins).filter(n => !d.side.some(c => c.name === n)),
          ...Object.keys(mu.outs).filter(n => !d.main.some(c => c.name === n))];
}

function renderPicker() {
  const d = deck();
  const usedBy = name => d.matchups.find(m => m.opps.some(o => o.toLowerCase() === name.toLowerCase()));
  const isSel = name => selected.some(o => o.toLowerCase() === name.toLowerCase());
  const shown = showAllMeta ? META : META.slice(0, META_TOP);
  // seleções fora da lista visível (personalizadas ou do fim do meta) continuam aparecendo
  const extra = selected.filter(n => !shown.some(m => m.name.toLowerCase() === n.toLowerCase()));
  const chip = (name, pct) => {
    const u = usedBy(name);
    return `<button class="chip ${isSel(name) ? 'sel' : u ? 'used' : ''}" data-act="sel-meta" data-name="${esc(name)}"
      title="${u ? 'Já está em: ' + esc(label(u)) : ''}">${esc(name)}${pct != null ? `<span class="pct">${pct}%</span>` : ''}</button>`;
  };
  $('meta-chips').innerHTML = shown.map(m => chip(m.name, m.pct)).join('') + extra.map(n => chip(n, metaPct(n))).join('');
  $('toggle-all-meta').textContent = showAllMeta ? 'Mostrar só o top ' + META_TOP : `Mostrar todos (${META.length})`;
  const pct = selected.reduce((n, o) => n + (metaPct(o) || 0), 0);
  $('sel-summary').innerHTML = selected.length
    ? `<b>${selected.length}</b> selecionado${selected.length === 1 ? '' : 's'} · ${pct.toFixed(1)}% do meta — vira um side só`
    : '<span class="muted">Toque nos arquétipos que usam o mesmo side.</span>';
  $('add-mu').disabled = $('clear-sel').disabled = !selected.length;
  $('add-mu').textContent = selected.length > 1 ? `Criar side p/ ${selected.length} arquétipos` : 'Criar side';
  $('meta-dl').innerHTML = META.map(m => `<option value="${esc(m.name)}">`).join('');
  // cobertura: % do meta com side confirmado
  const covered = new Set(d.matchups.filter(m => m.done).flatMap(m => m.opps.map(o => o.toLowerCase())));
  const cov = META.filter(m => covered.has(m.name.toLowerCase())).reduce((n, m) => n + m.pct, 0);
  $('coverage').textContent = `Meta coberto: ${cov.toFixed(1)}%`;
}

function toggleSel(name) {
  name = name.trim();
  if (!name) return;
  const known = META.find(m => m.name.toLowerCase() === name.toLowerCase());
  if (known) name = known.name;
  const i = selected.findIndex(o => o.toLowerCase() === name.toLowerCase());
  if (i >= 0) selected.splice(i, 1); else selected.push(name);
  renderPicker();
}

function renderMatchups() {
  const d = deck();
  if ($('meta-chips')) renderPicker();
  if (!d.matchups.length) {
    $('mu-list').innerHTML = `<div class="card empty">Escolha um ou mais arquétipos acima e clique em <b>Criar side</b>.</div>`;
    return;
  }
  $('mu-list').innerHTML = d.matchups.map((mu, idx) => {
    const e = eff(mu, d);
    const nin = sumObj(e.ins), nout = sumObj(e.outs);
    const open = mu.id === openMuId;
    const status = mu.done
      ? (nin !== nout ? `<span class="badge warn">✓ ${nin}≠${nout}</span>` : `<span class="badge ok">✓ salvo</span>`)
      : `<span class="badge draft">rascunho</span>`;
    let html = `<div class="card mu" id="mu-${mu.id}">
      <div class="mu-head" data-act="toggle-mu" data-id="${mu.id}">
        <span class="title">${esc(label(mu))}</span>
        <span class="delta"><span class="in">+${nin}</span> / <span class="out">−${nout}</span></span>
        ${status}
        <button class="icon ghost" data-act="mu-up" data-id="${mu.id}" ${idx === 0 ? 'disabled' : ''} title="Subir">↑</button>
        <button class="icon ghost" data-act="mu-down" data-id="${mu.id}" ${idx === d.matchups.length - 1 ? 'disabled' : ''} title="Descer">↓</button>
      </div>`;
    if (open) html += renderMuBody(mu, d, e, nin, nout);
    return html + '</div>';
  }).join('');
}

function renderMuBody(mu, d, e, nin, nout) {
  const rows = (arr, zone, chosen) => arr.map((c, i) => {
    const n = chosen[c.name] || 0;
    return `<div class="pickrow ${n ? 'on' : ''}">
      <span class="have">${c.qty}</span>
      <span class="nm" data-act="pick" data-zone="${zone}" data-i="${i}">${esc(c.name)}</span>
      <button data-act="unpick" data-zone="${zone}" data-i="${i}" ${n ? '' : 'disabled'}>${zone === 'side' ? '▼' : '▲'}</button>
      <span class="cnt">${n || ''}</span>
      <button class="go" data-act="pick" data-zone="${zone}" data-i="${i}" ${n >= c.qty ? 'disabled' : ''}>${zone === 'side' ? '▲' : '▼'}</button>
    </div>`;
  }).join('');
  const orph = orphans(mu, d);
  const others = d.matchups.filter(m => m.id !== mu.id);
  const balance = nin === nout
    ? `<span class="muted small">Entram ${nin}, saem ${nout} — fechado em ${total(d.main)} cartas.</span>`
    : `<span class="small" style="color:var(--gold)">Entram ${nin}, saem ${nout} — o main fica com ${total(d.main) - nout + nin} cartas.</span>`;
  return `<div class="mu-body">
    <div class="row">
      <div class="grow"><label class="field">Adversários com este side</label>
        <div class="opps">${mu.opps.map((o, i) => `<span class="opp">${esc(o)}${metaPct(o) != null ? ` <span class="pct">${metaPct(o)}%</span>` : ''}<button data-act="rm-opp" data-id="${mu.id}" data-i="${i}" title="Remover">✕</button></span>`).join('')}
          <input type="text" list="meta-dl" data-field="add-opp" data-id="${mu.id}" placeholder="+ adicionar arquétipo"></div></div>
      ${others.length ? `<div><label class="field">Copiar side de</label>
        <select data-field="copy" data-id="${mu.id}" style="width:auto"><option value="">—</option>${others.map(o => `<option value="${o.id}">${esc(label(o))}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="pickcols">
      <div class="pick side">
        <h4><span>▲ Entram (sideboard)</span><span>+${nin}</span></h4>
        ${d.side.length ? rows(d.side, 'side', e.ins) : '<div class="small muted">Lista sem sideboard.</div>'}
      </div>
      <div class="pick main">
        <h4><span>▼ Saem (main deck)</span><span>−${nout}</span></h4>
        ${rows(d.main, 'main', e.outs)}
      </div>
    </div>
    ${orph.length ? `<div class="orphan">⚠ Cartas salvas nesta partida que não estão mais na lista: ${orph.map(esc).join(', ')}. <a href="#" data-act="clear-orphans" data-id="${mu.id}" style="color:inherit">Remover</a></div>` : ''}
    <div style="margin-top:12px"><label class="field">Notas (plano de jogo, o que observar)</label>
      <textarea rows="2" data-field="notes" data-id="${mu.id}" placeholder="ex.: ser agressivo, segurar Thraben Charm pro Guardian…">${esc(mu.notes || '')}</textarea></div>
    <div class="mu-foot">
      <button class="primary" data-act="confirm-mu" data-id="${mu.id}">✓ Confirmar side</button>
      <button data-act="reset-mu" data-id="${mu.id}">Limpar</button>
      <span class="grow">${balance}</span>
      <button class="danger ghost" data-act="del-mu" data-id="${mu.id}">Excluir</button>
    </div>
  </div>`;
}

function addMatchup() {
  const inp = $('mu-new');
  if (inp.value.trim()) { toggleSel(inp.value); inp.value = ''; }
  if (!selected.length) { inp.focus(); return; }
  const mu = { id: uid(), opps: [...selected], ins: {}, outs: {}, notes: '', done: false };
  deck().matchups.push(mu);
  openMuId = mu.id;
  selected = [];
  save();
  renderMatchups();
  document.getElementById('mu-' + mu.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const findMu = id => deck().matchups.find(m => m.id === id);
const openMu = () => findMu(openMuId);

/* ---------- Impressão ---------- */
function renderSheet() {
  const d = deck();
  const withList = $('p-list').checked, withDrafts = $('p-drafts').checked;
  const mus = d.matchups.filter(m => m.done || withDrafts);
  const listCol = (title, arr) => `<b>${title} (${total(arr)})</b>${arr.map(c => `<div>${c.qty} ${esc(c.name)}</div>`).join('')}`;
  const io = obj => {
    const ks = Object.keys(obj);
    return ks.length ? ks.map(k => `<div>${obj[k]} ${esc(k)}</div>`).join('') : '<div class="none">—</div>';
  };
  $('sheet').innerHTML = `
    <div class="shead">
      <img src="assets/logo.png" alt="">
      <div>
        <h1>${esc(d.name)}</h1>
        <div class="sub">Mana no Pano · Guia de sideboard · ${fmtDate(d.date)} · ${mus.length} partida${mus.length === 1 ? '' : 's'}</div>
      </div>
    </div>
    ${withList ? `<div class="plist">${listCol('Main', d.main)}${listCol('Side', d.side)}</div>` : ''}
    <div class="mus">${mus.map(m => {
      const e = eff(m, d);
      return `<div class="pmu">
        <h3>${esc(label(m))}</h3>
        <div class="io">
          <div class="in"><div class="lbl">ENTRA +${sumObj(e.ins)}</div>${io(e.ins)}</div>
          <div class="out"><div class="lbl">SAI −${sumObj(e.outs)}</div>${io(e.outs)}</div>
        </div>
        ${m.notes ? `<div class="note">${esc(m.notes)}</div>` : ''}
      </div>`;
    }).join('') || '<p class="none">Nenhuma partida confirmada ainda. Marque “Incluir rascunhos” ou confirme alguma partida.</p>'}</div>`;
}

/* ---------- Eventos ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') ev.preventDefault();

  switch (act) {
    case 'new-deck': openForm('new'); break;
    case 'form-save': saveForm(); break;
    case 'form-cancel': formMode === 'edit' ? openDeck(currentId) : (renderLibrary(), show('library')); break;
    case 'open': openDeck(id); break;
    case 'dup': duplicateDeck(id); break;
    case 'dup-current': duplicateDeck(currentId); break;
    case 'del-deck': {
      const d = state.decks.find(x => x.id === id);
      if (confirm(`Excluir "${d.name}" (${fmtDate(d.date)}) e todas as partidas?`)) {
        state.decks = state.decks.filter(x => x.id !== id); save(); renderLibrary();
      }
      break;
    }
    case 'go-library': renderLibrary(); show('library'); break;
    case 'edit-list': openForm('edit'); break;
    case 'add-mu': addMatchup(); break;
    case 'sel-meta': toggleSel(el.dataset.name); break;
    case 'clear-sel': selected = []; renderPicker(); break;
    case 'toggle-all-meta': showAllMeta = !showAllMeta; renderPicker(); break;
    case 'rm-opp': {
      const mu = findMu(id);
      mu.opps.splice(+el.dataset.i, 1);
      save(); renderMatchups();
      break;
    }

    case 'toggle-mu':
      if (ev.target.closest('button')) return; // ↑ ↓ têm ação própria
      openMuId = openMuId === id ? null : id;
      renderMatchups();
      break;
    case 'mu-up': case 'mu-down': {
      const ms = deck().matchups, i = ms.findIndex(m => m.id === id), j = act === 'mu-up' ? i - 1 : i + 1;
      if (j < 0 || j >= ms.length) return;
      [ms[i], ms[j]] = [ms[j], ms[i]];
      save(); renderMatchups();
      break;
    }
    case 'pick': case 'unpick': {
      const mu = openMu(); if (!mu) return;
      const d = deck(), zone = el.dataset.zone, card = d[zone][+el.dataset.i];
      const obj = zone === 'side' ? mu.ins : mu.outs;
      const cur = Math.min(obj[card.name] || 0, card.qty);
      const next = act === 'pick' ? Math.min(cur + 1, card.qty) : Math.max(cur - 1, 0);
      if (next) obj[card.name] = next; else delete obj[card.name];
      mu.done = false;
      save(); renderMatchups();
      break;
    }
    case 'confirm-mu': {
      const mu = findMu(id);
      mu.done = true; openMuId = null;
      save(); renderMatchups();
      break;
    }
    case 'reset-mu': {
      const mu = findMu(id);
      mu.ins = {}; mu.outs = {}; mu.done = false;
      save(); renderMatchups();
      break;
    }
    case 'clear-orphans': {
      const mu = findMu(id), d = deck();
      mu.ins = eff(mu, d).ins; mu.outs = eff(mu, d).outs;
      save(); renderMatchups();
      break;
    }
    case 'del-mu': {
      const mu = findMu(id);
      if (confirm(`Excluir o side "${label(mu)}"?`)) {
        deck().matchups = deck().matchups.filter(m => m.id !== id); openMuId = null;
        save(); renderMatchups();
      }
      break;
    }

    case 'print': renderSheet(); $('preview').classList.remove('hidden'); break;
    case 'do-print': window.print(); break;
    case 'close-preview': $('preview').classList.add('hidden'); break;

    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `side-builder-backup-${today()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': $('import-file').click(); break;
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'f-list') return updateFormPreview();
  if (t.id === 'd-name') { deck().name = t.value; return save(); }
  if (t.id === 'd-date') { deck().date = t.value; return save(); }
  const f = t.dataset.field;
  if (f === 'notes') { findMu(t.dataset.id).notes = t.value; save(); }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.field === 'copy' && t.value) {
    const mu = findMu(t.dataset.id), src = findMu(t.value);
    mu.ins = { ...src.ins }; mu.outs = { ...src.outs }; mu.done = false;
    save(); renderMatchups();
  }
  if (t.dataset.field === 'add-opp' && t.value.trim()) addOpp(t);
  if (t.id === 'p-list' || t.id === 'p-drafts') renderSheet();
  if (t.id === 'import-file' && t.files[0]) {
    t.files[0].text().then(txt => {
      const s = JSON.parse(txt);
      if (!s || !Array.isArray(s.decks)) throw new Error();
      migrate(s);
      const ids = new Set(state.decks.map(d => d.id));
      const novos = s.decks.filter(d => !ids.has(d.id));
      state.decks.push(...novos);
      save(); renderLibrary();
      alert(`${novos.length} deck(s) importado(s).` + (s.decks.length > novos.length ? ` ${s.decks.length - novos.length} já existiam e foram mantidos.` : ''));
    }).catch(() => alert('Arquivo de backup inválido.')).finally(() => t.value = '');
  }
});

function addOpp(input) {
  const mu = findMu(input.dataset.id);
  let name = input.value.trim();
  const known = META.find(m => m.name.toLowerCase() === name.toLowerCase());
  if (known) name = known.name;
  if (!mu.opps.some(o => o.toLowerCase() === name.toLowerCase())) mu.opps.push(name);
  input.value = '';
  save(); renderMatchups();
  const again = document.querySelector(`#mu-${mu.id} [data-field=add-opp]`);
  if (again) again.focus();
}

$('mu-new').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.value.trim()) { toggleSel(ev.target.value); ev.target.value = ''; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.field === 'add-opp' && ev.target.value.trim()) addOpp(ev.target);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') $('preview').classList.add('hidden'); });

renderLibrary();
</script>
</body>
